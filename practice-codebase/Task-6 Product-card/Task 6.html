<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Shoes Card</title>
    <link rel="stylesheet" href="Task 6.css">
</head>
<body>

    <div class="product-card">

        <div class="image-section">
            <img src="ryan-waring-164_6wVEHfI-unsplash.jpg.jpeg" alt="Premium red running shoe">

            <span class="discount">20% OFF</span>

            <button class="wishlist" aria-label="Add to wishlist">♡</button>
        </div>

        <div class="product-info">

            <div class="category">SPORTS SHOES</div>

            <h2>Premium Running Shoes</h2>

            <div class="rating">
                <span class="stars">★ ★ ★ ★ ★</span>
                <span class="reviews">(120)</span>
            </div>

            <div class="price-row">
                <span class="price">₹1,999</span>
                <span class="old-price">₹2,499</span>
            </div>

            <button class="cart-btn">Add to Cart</button>

        </div>
    </div>

</body>
</html>
