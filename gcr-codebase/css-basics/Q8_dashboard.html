<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Dashboard</title>
    <link rel="stylesheet" href="Q8_dashboard.css">
</head>
<body>
    <header class="topbar">
        <h1>My Dashboard</h1>
        <span>Welcome back!</span>
    </header>

    <div class="dashboard">
        <aside class="sidebar">
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Analytics</a>
                <a href="#">Projects</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main class="content">
            <section class="content-box">
                <h2>Overview</h2>
                <div class="stats">
                    <div><strong>128</strong><span>Tasks</span></div>
                    <div><strong>24</strong><span>Projects</span></div>
                    <div><strong>86%</strong><span>Progress</span></div>
                </div>
            </section>

            <section class="content-box">
                <h2>Recent Activity</h2>
                <p>Website design project was updated today.</p>
                <p>New team member joined the workspace.</p>
                <p>Weekly report is ready for review.</p>
            </section>
        </main>
    </div>
</body>
</html>
