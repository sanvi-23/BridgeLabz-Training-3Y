<!DOCTYPE html>
<html>
<head>
    <title>Product Catalog</title>
</head>
<body>

    <h1>Online Store Product Catalog</h1>

    <table border="1">
        <tr>
            <th>Product Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>Notebook</td>
            <td><img src="https://via.placeholder.com/100" alt="Notebook"></td>
            <td>Hardbound ruled notebook</td>
            <td>₹150</td>
            <td>Available</td>
        </tr>

        <tr>
            <td>Pen</td>
            <td><img src="https://via.placeholder.com/100" alt="Pen"></td>
            <td>Blue ink ball pen</td>
            <td>₹30</td>
            <td>Available</td>
        </tr>

        <tr>
            <td rowspan="2">Study Pack</td>
            <td><img src="https://via.placeholder.com/100" alt="Study Pack"></td>
            <td colspan="2">Notebook and pen combo</td>
            <td>Available</td>
        </tr>

        <tr>
            <td colspan="3">Special student package</td>
            <td>Limited</td>
        </tr>
    </table>

</body>
</html>
