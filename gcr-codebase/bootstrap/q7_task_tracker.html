<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q7_task_tracker.css">
</head>
<body class="bg-light">
<main class="container py-5">
  <section class="card shadow-sm border-0 mx-auto" style="max-width: 800px;">
    <header class="card-header bg-white p-4 d-flex justify-content-between align-items-center">
      <div><h1 class="h3 mb-1">Task Tracker</h1><p class="text-secondary mb-0">Stay on top of your priorities.</p></div>
      <span class="badge text-bg-danger fs-6">4 Pending</span>
    </header>
    <div class="card-body p-4">
      <div class="list-group">
        <div class="list-group-item d-flex justify-content-between align-items-center">
          <span>Finish project documentation</span><span class="badge text-bg-danger">High</span>
        </div>
        <div class="list-group-item d-flex justify-content-between align-items-center">
          <span>Review Bootstrap assignment</span><span class="badge text-bg-warning">Medium</span>
        </div>
        <div class="list-group-item d-flex justify-content-between align-items-center">
          <span>Update portfolio</span><span class="badge text-bg-warning">Medium</span>
        </div>
        <div class="list-group-item d-flex justify-content-between align-items-center">
          <span>Organize study notes</span><span class="badge text-bg-success">Low</span>
        </div>
      </div>
      <button class="btn btn-success mt-4">Completed <span class="badge text-bg-light text-dark">2</span></button>
    </div>
  </section>
</main>
</body>
</html>
