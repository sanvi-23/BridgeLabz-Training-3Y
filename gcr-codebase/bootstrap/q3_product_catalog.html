<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="q3_product_catalog.css">
</head>
<body>
<header class="bg-dark text-white py-4">
  <div class="container text-center"><h1 class="fw-bold">Urban Essentials</h1><p class="mb-0">Everyday products, thoughtfully selected.</p></div>
</header>
<main class="py-5">
  <div class="container">
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 shadow-sm">
        <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="White shirt">
        <div class="card-body"><h2 class="h5">Classic Shirt</h2><p class="fw-bold">₹1,499</p><button class="btn btn-dark w-100">Add to Cart</button></div>
      </div></div>
      <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 shadow-sm">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Running shoes">
        <div class="card-body"><h2 class="h5">Runner Sneakers</h2><p class="fw-bold">₹2,999</p><button class="btn btn-dark w-100">Add to Cart</button></div>
      </div></div>
      <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 shadow-sm">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Wrist watch">
        <div class="card-body"><h2 class="h5">Minimal Watch</h2><p class="fw-bold">₹3,499</p><button class="btn btn-dark w-100">Add to Cart</button></div>
      </div></div>
      <div class="col-12 col-sm-6 col-md-3"><div class="card product-card h-100 shadow-sm">
        <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=700&q=80" class="card-img-top" alt="Leather bag">
        <div class="card-body"><h2 class="h5">Leather Tote</h2><p class="fw-bold">₹2,499</p><button class="btn btn-dark w-100">Add to Cart</button></div>
      </div></div>
    </div>
  </div>
</main>
<footer class="text-center py-4 bg-light">© 2026 Urban Essentials</footer>
</body>
</html>
