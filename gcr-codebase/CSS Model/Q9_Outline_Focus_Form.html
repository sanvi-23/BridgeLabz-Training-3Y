<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Styling Form</title>
    <link rel="stylesheet" href="Q9_Outline_Focus_Form.css">
</head>
<body>
    <header>
        <h1>Outline &amp; Focus Styling</h1>
        <p>A small accessible form demonstrating CSS focus states.</p>
    </header>

    <main>
        <section class="form-section" aria-labelledby="form-title">
            <h2 id="form-title">Contact Form</h2>
            <form>
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input id="full-name" type="text" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message"></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Assignment 7 &mdash; Question 9</p>
    </footer>
</body>
</html>
