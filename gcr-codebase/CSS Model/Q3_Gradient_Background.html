<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background Webpage</title>
    <link rel="stylesheet" href="Q3_Gradient_Background.css">
</head>
<body>
    <header class="fixed-header">
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>
        <section class="gradient-section linear" aria-labelledby="linear-title">
            <div class="content-card">
                <h2 id="linear-title">Linear Gradient</h2>
                <p>This section uses a linear gradient that transitions smoothly from one color to another along a straight line.</p>
            </div>
        </section>

        <section class="gradient-section radial" aria-labelledby="radial-title">
            <div class="content-card">
                <h2 id="radial-title">Radial Gradient</h2>
                <p>This section uses a radial gradient that spreads outward from a central point.</p>
            </div>
        </section>
    </main>

    <footer class="fixed-footer">
        <p>Assignment 7 &mdash; Question 3</p>
    </footer>
</body>
</html>
