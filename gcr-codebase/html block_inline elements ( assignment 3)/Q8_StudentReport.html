<!DOCTYPE html>
<html>
<head>
    <title>Student Report</title>
</head>
<body>

    <h1>ABC School</h1>

    <h2>Student Report Card</h2>

    <table border="1">
        <tr>
            <th title="Name of the subject">Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>English</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
        </tr>
        <tr>
            <td>Social Science</td>
            <td>82</td>
        </tr>

        <tr>
            <td colspan="1">Total</td>
            <td>440 / 500</td>
        </tr>

        <tr>
            <td rowspan="1">Percentage</td>
            <td>88%</td>
        </tr>
    </table>

</body>
</html>
