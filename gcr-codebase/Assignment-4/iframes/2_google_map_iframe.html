<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
</head>
<body>
    <h1>My School / City Map</h1>

    <!-- loading="lazy" delays loading the map until it is close to the visible area. -->
    <iframe
        src="https://www.google.com/maps?q=Delhi,India&output=embed"
        width="600"
        height="450"
        loading="lazy"
        title="Google Map">
    </iframe>
</body>
</html>
