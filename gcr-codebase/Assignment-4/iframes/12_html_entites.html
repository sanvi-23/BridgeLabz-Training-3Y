<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <h1>HTML Entities</h1>

    <p>&lt; This is the less-than symbol.</p>
    <p>&gt; This is the greater-than symbol.</p>
    <p>&amp; This is the ampersand symbol.</p>
    <p>&quot; This is a double quotation mark.</p>
    <p>&#39; This is a single quotation mark.</p>

    <p>&copy; Copyright symbol</p>
    <p>&trade; Trademark symbol</p>
    <p>&reg; Registered trademark symbol</p>
</body>
</html>
